name: ▶️ PR Notifications

on:
  pull_request:
    types: [opened, reopened, closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  notify-ntfy:
    name: Send PR Notification
    runs-on: ubuntu-26.04
    environment: pr-notifications

    permissions: {}

    steps:
      - name: Determine PR notification type
        id: notification
        env:
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
          GITHUB_EVENT_PULL_REQUEST_MERGED: ${{ github.event.pull_request.merged }}
        run: |
          if [ "${GITHUB_EVENT_ACTION}" = "opened" ]; then
            echo "tags=green_circle" >> "$GITHUB_OUTPUT"
            echo "title=New PR" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_EVENT_ACTION}" = "reopened" ]; then
            echo "tags=arrows_counterclockwise" >> "$GITHUB_OUTPUT"
            echo "title=PR Reopened" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_EVENT_ACTION}" = "closed" ] && [ "${GITHUB_EVENT_PULL_REQUEST_MERGED}" = "true" ]; then
            echo "tags=purple_circle" >> "$GITHUB_OUTPUT"
            echo "title=PR Merged" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_EVENT_ACTION}" = "closed" ]; then
            echo "tags=black_circle" >> "$GITHUB_OUTPUT"
            echo "title=PR Closed" >> "$GITHUB_OUTPUT"
          fi

      - name: Send PR Notification to ntfy
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TAGS: ${{ steps.notification.outputs.tags }}
          TITLE: ${{ steps.notification.outputs.title }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
        run: |-
          curl -fsS -o /dev/null \
            -H "Authorization: Bearer ${NTFY_TOKEN}" \
            -H "Title: ${TITLE}" \
            -H "Tags: ${TAGS}" \
            -H "Click: ${PR_URL}" \
            -H "Actions: view, Open PR, ${PR_URL}" \
            --data-raw "${PR_TITLE} by ${PR_AUTHOR} (${REPO})" \
            "${NTFY_URL}"
