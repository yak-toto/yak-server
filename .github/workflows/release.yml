name: 🆙 Release

on:
  workflow_dispatch:
    inputs:
      release-type:
        type: choice
        description: Release type
        options:
          - patch
          - minor
          - major

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    environment: release

    permissions:
      id-token: write # <-- Required for publishing to PyPI
      contents: write # <-- Enables push
      packages: write # <-- Required for pushing to GHCR

    env:
      COMPETITION: "world_cup_2026"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.14"
          enable-cache: false

      - name: Create commits
        id: create-commits
        run: |
          git config user.name 'yak-toto'
          git config user.email 'yaktoto648@gmail.com'
          uv version --bump "${GITHUB_EVENT_INPUTS_RELEASE_TYPE}"
          NEW_VERSION=$(uv version --short)
          uv lock
          git add pyproject.toml uv.lock
          git commit -m "Release ${NEW_VERSION}"
          git tag -a "${NEW_VERSION}" HEAD -m \""${NEW_VERSION}"\"
          echo "new-version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_EVENT_INPUTS_RELEASE_TYPE: ${{ github.event.inputs.release-type }}

      - name: Push
        uses: ad-m/github-push-action@881a6320fdb16eb5318c5054f31c218aec2b324c # v1.3.0
        with:
          tags: true

      - name: Checkout code
        run: git checkout "${STEPS_CREATE_COMMITS_OUTPUTS_NEW_VERSION}"
        env:
          STEPS_CREATE_COMMITS_OUTPUTS_NEW_VERSION: ${{ steps.create-commits.outputs.new-version }}

      - name: Build distribution
        run: uv build

      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image to GHCR
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.create-commits.outputs.new-version }}-${{ env.COMPETITION }}
          build-args: |
            COMPETITION=${{ env.COMPETITION }}

      - name: Create Release
        id: create-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.create-commits.outputs.new-version }}
        run: |
          RELEASE_URL=$(gh release create "${TAG}" dist/* --generate-notes --title "${TAG}")
          echo "html_url=${RELEASE_URL}" >> "$GITHUB_OUTPUT"

      - name: Send Release Notification to ntfy
        if: success()
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          RELEASE_TAG: ${{ steps.create-commits.outputs.new-version }}
          RELEASE_URL: ${{ steps.create-release.outputs.html_url }}
          REPO: ${{ github.repository }}
        run: |-
          curl -fsS -o /dev/null \
            -H "Authorization: Bearer ${NTFY_TOKEN}" \
            -H "Title: New release ${RELEASE_TAG}" \
            -H "Tags: tada,package" \
            -H "Actions: view, Release notes, ${RELEASE_URL}; view, PyPI, https://pypi.org/project/yak-server/${RELEASE_TAG}/" \
            -d "${REPO} ${RELEASE_TAG} is out" \
            "${NTFY_URL}"
